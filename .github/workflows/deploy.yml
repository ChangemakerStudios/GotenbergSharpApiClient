name: Build and Push to Nuget

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet/login exchange a GitHub OIDC token for a short-lived API key

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.x'

    - name: GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
      with:
        configFilePath: GitVersion.yml

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run tests
      run: dotnet test --no-build -c Release --verbosity normal

    - name: Pack
      run: dotnet pack src/Gotenberg.Sharp.Api.Client/Gotenberg.Sharp.Api.Client.csproj -c Release -p:PackageVersion=${{ steps.gitversion.outputs.FullSemVer }} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

    - name: NuGet login (Trusted Publishing)
      id: login
      if: github.event_name != 'pull_request' && (github.ref_name == 'master')
      uses: NuGet/login@v1
      with:
        user: jaben

    - name: Publish
      if: github.event_name != 'pull_request' && (github.ref_name == 'master')
      run: dotnet nuget push src/Gotenberg.Sharp.Api.Client/bin/Release/*.nupkg --source 'https://api.nuget.org/v3/index.json' -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate        
